# Only workerd (Cloudflare's local runtime) needs its install script.
# esbuild is pulled in by wrangler but never used by our build (Vite+ uses Rolldown/Oxc),
# and its native binary still arrives via @esbuild/<platform>, so skip its postinstall.
allowBuilds:
  esbuild: false
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
  # Security patches for transitive deps (both only run at build time)
  postcss-selector-parser@<6.1.5: ">=6.1.5 <7"
  satori@<0.33.5: ">=0.33.5 <0.34"
  fflate@>=0.7.0 <0.7.5: ">=0.7.5 <0.8"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
